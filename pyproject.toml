[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uzdigest"
version = "0.1.0"
description = "Ежедневный дайджест новостей бизнеса, финансов, налогов и бухучёта Узбекистана"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "feedparser",
    "pydantic",
    "PyYAML",
    "python-dotenv",
    "tzdata",
    "claude-agent-sdk",
    "trafilatura",
    "Jinja2",
    "python-telegram-bot>=22.8,<23",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
uzdigest = "uzdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uzdigest = ["db/schema/*.sql", "llm/prompts/*.md", "render/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude", "_archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
