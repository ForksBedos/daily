# Глоссарий и правила перевода дайджеста (llm/translate.py, промпт translate_v1).
# Пополняется по замечаниям носителя языка на пилоте. Любая правка здесь меняет отпечаток входа,
# и переводы пересоздаются при следующей сборке.
#
# Узбекский — латиница (вопрос 5 к команде): o‘ и g‘ с апострофом ‘ (U+2018), тутуқ белгиси — ’ (U+2019).

languages:
  en:
    name: английский
    rules: |
      ## Английский
      - Даты: «28 October 2026». Десятичный знак — точка, разряды — запятая: «1.5 million», «12,023.46».
      - Суммы в сумах: «UZS 1.5 million» или «1.5 million soums».
      - Номера актов остаются латиницей, как в оригинале, чтобы их можно было найти на lex.uz: «Presidential Decree No. UP-236», «Presidential Resolution No. PP-387», «Law No. ZRU-1184», «Cabinet of Ministers Resolution No. 594».
  uz:
    name: узбекский (латиница)
    rules: |
      ## Узбекский
      - Только латиница по действующей орфографии: o‘, g‘ (с ‘), sh, ch, ng; тутуқ белгиси — ’ (ma’lumot, ta’lim).
      - Даты: «2026-yil 28-oktabr» или «28.10.2026». Десятичный знак — запятая: «1,5 mln so‘m», разряды — пробел: «12 023,46».
      - Номера актов — официальными узбекскими сокращениями: УП → PF («Prezidentning PF-236-son Farmoni»), ПП → PQ («PQ-387-son qarori»), ЗРУ → O‘RQ («O‘RQ-1184-son Qonun»), ПКМ → VMQ («Vazirlar Mahkamasining 594-son qarori (VMQ-594)»).
      - Пиши так, как пишут узбекские деловые СМИ (gazeta.uz/oz, kun.uz/uz), без кальки с русского.

