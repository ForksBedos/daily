# Словари префильтра (docs/plan/stage-3-dedup.md, задача 3.1). Цель — снять около половины
# очевидного шума и не потерять ничего нужного: лучше пропустить лишнее, чем отсечь важное.
#
# Слово сравнивается с началом слова в тексте без учёта регистра: «налог» ловит «налоговый»,
# «налогам». Слово с «$» на конце — только целиком: «ндс$» не ловит «ндсу».
# Источники уровней A и B проходят без фильтра. Уровень C отсекается, если:
#   - рубрика RSS из stop_categories или адрес по exclude_url_patterns источника (sources.yaml)
#     и в заголовке нет ни одного тематического слова;
#   - в заголовке есть стоп-тема, а в заголовке и первых 300 знаках текста нет тематического слова.

