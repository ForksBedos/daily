# Профили площадок для генератора постов (docs/plan/stage-7-posts.md).
# Новая площадка — новый блок в platforms, код не меняется. Образцы постов СММ кладутся в
# config/post_examples/{код площадки}/*.md и попадают в промпт как есть.
#
# Тон, языки по умолчанию и правила ниже — предложение по умолчанию: ждут ответа СММ
# (stage-7-posts.md, «Что нужно от СММ»). Любая правка меняет отпечаток входа: «тот же пост»
# после правки делается заново.
#
# Лимиты сверены 03.11.2026 по сводкам сторонних сервисов; перед запуском перепроверить по справке
# площадок. Длина считается в единицах UTF-16 (эмодзи — 2): так считает Telegram, для остальных
# площадок это с запасом.

brand:
  name: Crowe Uzbekistan
  about: |
    Crowe Uzbekistan — аудиторско-консалтинговая компания, член международной сети Crowe Global: аудит, бухгалтерское сопровождение, налоговый и юридический консалтинг.
  advice_label:
    ru: Наши эксперты рекомендуют
    en: Our experts recommend
    uz: Mutaxassislarimiz tavsiya qiladi

tone: |
  - Пишем от лица компании: «мы», к читателю на «вы». Спокойно и по делу, как опытный консультант клиенту, а не новостное издание.
  - Без оценок законов и решений, без прогнозов, без рекламы услуг и призывов обратиться к нам.
  - В посте не больше трёх чисел: только те, что нужны для решения, — ставка, сумма, срок. Остальные опусти.
  - Эмодзи — не больше двух на пост и только как маркеры (📌, 📄, ⚖️), можно без них.
  - Ведомство, принявшее решение, называй в тексте, если это важно для читателя. Издание, где вышла новость, не называй.

platforms:
  telegram:
    name: Telegram
    langs: [ru, uz]        # первый — язык по умолчанию
    max_chars: 4096        # текст сообщения; подпись к картинке — 1024, картинок пост не делает
    target: [600, 1200]
    hashtags: [0, 3]
    link: required         # required — ссылка на источник обязательна; none — ссылок быть не должно
    rules: |
      - Первая строка — короткий заголовок жирным: **Заголовок**. Другой разметки не нужно.
      - Затем 2–4 коротких абзаца: что изменилось, кого касается, сроки и суммы.
      - Если у статьи есть акт на lex.uz — строка «Документ: …» со ссылкой на lex.uz.
      - В конце — подпись компании отдельной строкой, под ней короткая строка «Подробнее: <ссылка>», затем хэштеги, если они есть.

  linkedin:
    name: LinkedIn
    langs: [en, ru]
    max_chars: 3000
    target: [800, 1500]
    hashtags: [3, 5]
    link: required
    rules: |
      - До «…see more» видно 140–210 символов: первые две строки — крючок, главное изменение и кого оно касается.
      - Разметки нет: без звёздочек и заголовка жирным. Короткие абзацы через пустую строку, можно список из 2–4 пунктов.
      - Читатели — бухгалтеры, финансисты, руководители компаний: важны сроки, суммы, кого касается.
      - В конце — подпись компании отдельной строкой, под ней «Подробнее: <ссылка>», затем хэштеги одной строкой.

  threads:
    name: Threads
    langs: [ru, en]
    max_chars: 500
    target: [300, 480]
    hashtags: [0, 1]
    link: none
    rules: |
      - Одна мысль: главное изменение одной-двумя фразами и самая важная цифра или срок.
      - Без заголовка и разметки.
      - Ссылок нет: пост читают прямо в ленте. Подпись компании — последней строкой. Тег темы — не больше одного (Threads показывает один).
      - Одно главное число или срок, рекомендация — одной фразой.

  instagram:
    name: Instagram
    langs: [ru, uz]
    max_chars: 2200
    target: [600, 1200]
    hashtags: [5, 15]
    link: none
    rules: |
      - Ссылки в подписи не кликабельны: адресов не пиши. Последняя строка перед хэштегами — подпись компании.
      - Первая строка — заголовок без разметки, затем короткие абзацы; в начале абзацев можно эмодзи-маркеры, не больше трёх.
      - Хэштеги — в самом конце отдельным блоком.
