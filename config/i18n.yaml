# Подписи дайджеста на трёх языках (render/markdown.py, PLAN.md, раздел 7).
# Порядок полей статьи во всех языках один и тот же: краткое → подробное → (документ) → источник → также писали.
# В {фигурных скобках} — подставляемые значения. Узбекский — латиница: o‘ и g‘ с ‘ (U+2018),
# тутуқ белгиси — ’ (U+2019), как в glossary.yaml. Узбекские подписи проверяет носитель на пилоте.

ru:
  title: "Бизнес, финансы, налоги — {date}"
  months: [января, февраля, марта, апреля, мая, июня, июля, августа, сентября, октября, ноября, декабря]
  long_date: "{day} {month} {year}"
  short_date: "{dd}.{mm}.{year}"
  decimal: ","
  thousands: " "
  rates: "Курсы ЦБ на {date}"
  categories:
    legislation: Законодательство
    taxes: Налоги
    accounting: Бухучёт и отчётность
    finance: Финансы и банки
    business: Бизнес и инвестиции
    macro: Макроэкономика
  summary: Краткое содержание
  details: Подробное содержание
  document: Документ
  source: Источник
  also: Также писали
  no_llm: "Без ИИ-обработки: начало материала из источника."
  no_translation: ""
  check: "⚠️ Проверить"
  check_hint: ""
  effective: "дата вступления в силу: {date}"
  link_lang: {uz: "на узбекском", en: "на английском"}
  statuses:
    verified: "✅"
    pending: "⏳ ожидает публикации на lex.uz"
    draft: "📝 проект"
    not_found: "❓ на lex.uz не найден, проверить вручную"
  acts:
    ZRU: "Закон № ЗРУ-{number}"
    UP: "Указ Президента № УП-{number}"
    PP: "Постановление Президента № ПП-{number}"
    RP: "Распоряжение Президента № Р-{number}"
    PKM: "Постановление Кабинета Министров № {number}"
    MJ: "Ведомственный акт, зарегистрированный Минюстом за № {number}"
    SENATE: "Постановление Сената № {number}"
    COURT: "Решение суда № {number}"
  act_date: "{act} от {date}"
  updates: Обновления
  update: "{act} — опубликован на lex.uz: {link}. Ранее, в дайджесте за {date}, ожидал публикации: «{headline}»"
  not_responded: Не ответили
  all_responded: Все источники ответили
  stale: "нет опроса с {date}"
  no_llm_count: Без ИИ-обработки
  no_translation_count: Перевод не готов

